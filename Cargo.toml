[package]
name = "nemo-zoxide"
version = "0.1.0"
edition = "2024"
description = "Change Nemo location using zoxide"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
glib = { version = "0.22.9", features = ["log"] }
goblin = "0.10.7"
gtk = "0.19.0"
libc = "0.2.189"
log = "0.4.34"

[build-dependencies]
pkg-config = "0.3.34"
